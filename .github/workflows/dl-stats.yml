name: 다운로드 추이 기록

# GitHub 은 자산별 **누적** 다운로드 수만 준다(과거 시점을 되돌려 볼 수 없다).
# 그래서 매일 한 번 찍어 저장소에 쌓아 두어야 나중에 증가 곡선을 만들 수 있다.
# 서버가 필요 없고, 커밋 자체가 저장소 활동이라 스케줄이 비활성화되지 않는다
# (활동 없는 저장소는 60일 뒤 schedule 이 멈춘다).

on:
  schedule:
    - cron: '35 21 * * *'      # 매일 06:35 KST (UTC 21:35 — Actions 는 UTC 로 돈다)
  workflow_dispatch: {}         # 수동 실행도 허용

permissions:
  contents: write               # 스냅숏을 저장소에 커밋하려면 필요

concurrency:
  group: dl-stats
  cancel-in-progress: false     # 기록 작업은 취소하지 않는다(빈 날 생김 방지)

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 스냅숏 수집
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p stats
          today=$(date -u +%F)

          f=stats/downloads.csv
          [ -s "$f" ] || printf 'date,tag,asset,downloads\n' > "$f"
          # 같은 날 두 번 기록하지 않는다(수동 실행·재시도 대비)
          if grep -q "^\"$today\"," "$f"; then
            echo "오늘($today) 다운로드 기록이 이미 있음 — 건너뜀"
          else
            # 릴리스 전부 × 자산 전부 → date,tag,asset,downloads
            tmp=$(mktemp)
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '.[] | .tag_name as $t | .assets[] | [$t, .name, .download_count] | @csv' \
              | sed "s/^/\"$today\",/" > "$tmp"
            cat "$tmp" >> "$f"
            rm -f "$tmp"
          fi
          echo "다운로드 CSV 총 $(( $(wc -l < "$f") - 1 ))행"

          rf=stats/repo.csv
          [ -s "$rf" ] || printf 'date,stars,forks,watchers,open_issues\n' > "$rf"
          if grep -q "^\"$today\"," "$rf"; then
            echo "오늘($today) 저장소 지표 기록이 이미 있음 — 건너뜀"
          else
            # watchers 는 stargazers_count 의 별칭이므로 subscribers_count 를 쓴다
            tmp=$(mktemp)
            gh api "repos/${GITHUB_REPOSITORY}" \
              --jq '[.stargazers_count, .forks_count, .subscribers_count, .open_issues_count] | @csv' \
              | sed "s/^/\"$today\",/" > "$tmp"
            cat "$tmp" >> "$rf"
            rm -f "$tmp"
          fi
          echo "저장소 지표 CSV 총 $(( $(wc -l < "$rf") - 1 ))행"

      - name: 요약 생성
        run: |
          set -euo pipefail
          # 누적만 쌓인 CSV → 전일 대비·일별 증가를 계산한 읽을 수 있는 표
          python3 stats/report.py stats/downloads.csv > stats/README.md
          # 공개 README 최하단 '사용 현황' 도 갱신. 삽입까지 report.py 가 한다.
          python3 stats/report.py stats/downloads.csv --write-readme
          # 실행 화면에서도 바로 보이게(Actions 요약)
          cat stats/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: 커밋
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 반드시 add 를 먼저 한다 — 첫 실행에서 파일이 새로 생기면 추적되지 않아
          # `git diff` 가 변화를 못 본다. 첫날엔 SVG 가 없으므로 nullglob 으로 안전하게 처리한다.
          svgs=(stats/*.svg)
          git add stats/downloads.csv stats/repo.csv stats/README.md stats/report.py README.md
          if [ ${#svgs[@]} -gt 0 ]; then
            git add "${svgs[@]}"
          fi
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않음"; exit 0
          fi
          git commit -m "chore(stats): 다운로드 스냅숏 $(date -u +%F)"
          # 다른 커밋과 경합하면 한 번 재시도
          git push || (git pull --rebase --autostash && git push)
